name: Build MedScan AI Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Flet CLI & Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-cli

      - name: Build Android Release APK
        run: |
          flet build apk \
            --project medscan_ai \
            --org com.vikash.medscan \
            --product "MedScan AI" \
            --description "AI Medical Diagnostic & Health Assistant by Vikash Kumawat" \
            --yes \
            -v \
            app/

      - name: Upload APK as Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MedScan-AI-Release-APK
          path: |
            app/build/apk/*.apk
            build/apk/*.apk
            **/build/apk/*.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.1
          name: "MedScan AI Android APK v1.0.1"
          body: |
            ### MedScan AI Android Release APK
            - **Native Android APK** built with Python & Flet
            - Complete Deep Blue Native Android UI (Top Doctors, Doctor Chat, Report Scanner, Sanjeevani Risk ML)
            - Fixed serious_python root import resolution & Flet 1.1 class compatibility
            
            **Direct Download**: Click `app-release.apk` below to download directly to your Android device without needing to sign into GitHub.
          files: |
            app/build/apk/*.apk
            build/apk/*.apk
            **/build/apk/*.apk
        continue-on-error: true
