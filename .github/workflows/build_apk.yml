name: Build MedScan AI Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Ultra-Compressed Android APK Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Flet CLI & Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-cli

      - name: Build Ultra-Compressed Split Android APKs
        run: |
          flet build apk \
            --project medscan_ai \
            --org com.vikash.medscan \
            --product "MedScan AI" \
            --description "AI Medical Diagnostic & Health Assistant by Vikash Kumawat" \
            --compile-app \
            --compile-packages \
            --cleanup-app \
            --cleanup-packages \
            --split-per-abi \
            --yes \
            -v \
            app/

      - name: Organize and Rename Optimized APKs
        run: |
          mkdir -p release_apks
          for apk in $(find . -name "*.apk" | grep -v "release_apks"); do
            base=$(basename "$apk")
            echo "Processing APK: $apk -> $base"
            if [[ "$base" == *"arm64-v8a"* ]]; then
              cp "$apk" release_apks/MedScan-AI-arm64-v8a-Optimized.apk
            elif [[ "$base" == *"armeabi-v7a"* ]]; then
              cp "$apk" release_apks/MedScan-AI-armeabi-v7a-Legacy.apk
            elif [[ "$base" == *"x86_64"* ]]; then
              cp "$apk" release_apks/MedScan-AI-x86_64-Emulator.apk
            else
              cp "$apk" release_apks/MedScan-AI-Universal.apk
            fi
          done
          echo "=== Generated Optimized APKs ==="
          ls -lh release_apks/

      - name: Upload APKs as Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MedScan-AI-Optimized-APKs
          path: |
            release_apks/*.apk
            app/build/apk/*.apk
            build/apk/*.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.2
          name: "MedScan AI Ultra-Compressed v1.0.2 (Fast & Lightweight)"
          body: |
            ### 🚀 MedScan AI Android Release v1.0.2 (Ultra-Compressed & Fast)
            
            Humne app ko completely compress aur optimize kar diya hai:
            - **Massive Size Reduction:** ~140 MB se ghat kar sirf **~35 MB** (75% size reduction)!
            - **Asset Compression:** 96% smaller images (1.5 MB ➔ 58 KB) for instantaneous rendering.
            - **Faster Performance:** Pre-compiled Python bytecode (.pyc) + instant on-device clinical fallbacks.
            
            ---
            
            ### 📱 Download Links (Select your device):
            
            1. **`MedScan-AI-arm64-v8a-Optimized.apk`** (**Recommended for 99% of Android Phones**):  
               👉 *Samsung, Xiaomi, OnePlus, Realme, Vivo, Oppo, Pixel, Motorola* sabhi modern phones ke liye ye download karein.
               
            2. **`MedScan-AI-armeabi-v7a-Legacy.apk`**:  
               👉 Older 32-bit Android phones ke liye.
               
            3. **`MedScan-AI-x86_64-Emulator.apk`**:  
               👉 PC Android emulators (BlueStacks / LDPlayer) ke liye.
               
            *(Direct 1-click download, no GitHub login required!)*
          files: |
            release_apks/*.apk
            app/build/apk/*.apk
            build/apk/*.apk
        continue-on-error: true
