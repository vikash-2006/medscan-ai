name: Build MedScan AI Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-cli

      - name: Build Android Release APK
        run: |
          flet build apk \
            --project "MedScan AI" \
            --org "com.vikash.medscan" \
            --product "MedScan AI" \
            --description "AI Medical Diagnostic & Health Assistant by Vikash Kumawat" \
            app/

      - name: Upload APK as Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MedScan-AI-Release-APK
          path: build/apk/*.apk
          retention-days: 14
